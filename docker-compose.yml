version: '3.9'

services:
  mysql:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./user-management-service/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend

  user-management:
    build: ./user-management-service
    depends_on:
      - mysql
    networks:
      - backend

  initial-grades-handling:
    build: ./initial-grades-handling-service
    depends_on:
      - mysql
    networks:
      - backend

  initial-grades-access:
    build: ./initial-grades-access-service
    depends_on:
      - mysql
    networks:
      - backend

  statistics:
    build: ./statistics-service
    depends_on:
      - mysql
      - kafka-broker
    networks:
      - backend

  api-gateway:
    build: ./api-gateway
    ports:
      - "3000:3000"
    depends_on:
      - user-management
      - initial-grades-handling
      - initial-grades-access
      - statistics
    networks:
      - backend

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - backend

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CREATE_TOPICS: "initial-grades:1:1"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 20
    networks:
      - backend

  kafka-broker:
    build: ./kafka-broker
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: kafka-broker-service
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
