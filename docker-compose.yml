version: '3.9'

services:
  mysql:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./user-management-service/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend

  user-management:
    build: ./user-management-service
    depends_on:
      - mysql
    networks:
      - backend

  api-gateway:
    build: ./api-gateway
    ports:
      - "3000:3000"
    depends_on:
      - user-management
    networks:
      - backend

networks:
  backend:
