version: '3.9'

services:
  # --- MySQL for user-management ---
  mysql-user:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./user-management-service/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend

  # --- MySQL for initial-grades-handling ---
  mysql-grades:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - ./initial-grades-handling-service/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend

  # --- User Management microservice ---
  user-management:
    build: ./user-management-service
    depends_on:
      - mysql-user
    networks:
      - backend

  # --- Initial Grades Handling microservice ---
  initial-grades-handling:
    build: ./initial-grades-handling-service
    depends_on:
      - mysql-grades
    networks:
      - backend

  # --- API Gateway ---
  api-gateway:
    build: ./api-gateway
    ports:
      - "3000:3000"
    depends_on:
      - user-management
      - initial-grades-handling
    networks:
      - backend

  # --- Kafka infrastructure ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-broker:
    build: ./kafka-broker
    ports:
      - "3002:3002"
    environment:
      PORT: 3000
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: kafka-broker-service
    depends_on:
      - kafka
    networks:
      - backend

networks:
  backend:
